<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="claude-inspector-project" content="calamita">
<title>Fixture — HTML puro</title>
<style>body{font:14px system-ui;max-width:32rem;margin:2rem auto}label{display:block;margin:.8rem 0 .2rem}input{width:100%;padding:.4rem}</style>
</head>
<body>
<h1>Form ben fatto</h1>
<p>Il caso facile: <code>autocomplete</code> su ogni campo. Chrome lo compila già da solo —
serve come controllo, non come sfida.</p>
<form id="f">
  <label for="nome">Nome</label>
  <input id="nome" name="given-name" autocomplete="given-name">
  <label for="cognome">Cognome</label>
  <input id="cognome" name="family-name" autocomplete="family-name">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="email">
  <label for="tel">Telefono</label>
  <input id="tel" name="tel" type="tel" autocomplete="tel">
  <label for="via">Indirizzo</label>
  <input id="via" name="street-address" autocomplete="street-address">
  <label for="cap">CAP</label>
  <input id="cap" name="postal-code" autocomplete="postal-code">
  <label for="citta">Città</label>
  <input id="citta" name="address-level2" autocomplete="address-level2">
</form>
</body>
</html>
